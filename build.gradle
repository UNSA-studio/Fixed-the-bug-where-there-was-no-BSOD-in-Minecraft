plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.144'
}

version = mod_version
group = mod_group_id

repositories {
    mavenCentral()
}

base {
    archivesName = mod_id
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
}

neoForge {
    version = project.neo_version

    runs {
        client {
            client()
            gameDirectory = file('runs/client')
        }
        server {
            server()
            gameDirectory = file('runs/server')
            programArgument '--nogui'
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

dependencies {
    // Pure-Java QR code generator (MIT) - bundled via Jar-in-Jar, used to draw the
    // scannable QR code shown on the BSOD screen (links to minecraft.net).
    jarJar(implementation('io.nayuki:qrcodegen:[1.8.0,1.9.0)'))
}

// Cross-compile the Windows native crash hook with MinGW on the CI runner.
def jdkHome = System.getenv('JAVA_HOME') ?: org.gradle.internal.jvm.Jvm.current().getJavaHome().toString()

tasks.register('compileNativeHook') {
    def outDir = layout.buildDirectory.dir('native')
    outputs.file(outDir.map { it.file('bsod_crash_hook.dll') })
    doLast {
        outDir.get().asFile.mkdirs()
        exec {
            commandLine 'x86_64-w64-mingw32-gcc', '-shared', '-O2',
                    "-I${jdkHome}/include",
                    "-I${jdkHome}/include/linux",
                    'src/main/cpp/bsod_crash_hook.c',
                    '-lkernel32', '-luser32',
                    '-o', outDir.get().file('bsod_crash_hook.dll').asFile
        }
                exec {
            commandLine 'x86_64-w64-mingw32-gcc', '-mwindows', '-O2',
                    'src/main/cpp/bsod_overlay.c',
                    '-luser32', '-lgdi32', '-lshell32',
                    '-o', outDir.get().file('bsod_overlay.exe').asFile
        }
    }
}

// Linux native artifacts are compiled natively on the CI runner.
tasks.register('compileNativeHookLinux') {
    def outDir = layout.buildDirectory.dir('native')
    outputs.file(outDir.map { it.file('bsod_crash_hook.so') })
    doLast {
        outDir.get().asFile.mkdirs()
        exec {
            commandLine 'gcc', '-shared', '-fPIC', '-O2',
                    "-I${jdkHome}/include",
                    "-I${jdkHome}/include/linux",
                    'src/main/cpp/bsod_crash_hook_linux.c',
                    '-o', outDir.get().file('bsod_crash_hook.so').asFile
        }
        exec {
            commandLine 'gcc', '-O2',
                    'src/main/cpp/bsod_overlay_linux.c',
                    '-lX11', '-o', outDir.get().file('bsod_overlay_linux').asFile
        }
    }
}

tasks.named('processResources', ProcessResources).configure {
    dependsOn 'compileNativeHook'
    dependsOn 'compileNativeHookLinux'
    from(layout.buildDirectory.dir('native')) {
        include '*.dll'
        include 'bsod_crash_hook.so'
        include 'bsod_overlay_linux'
        include '*.exe'
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

jar {
    manifest {
        attributes([
                'Specification-Title'   : mod_id,
                'Specification-Vendor'  : mod_authors,
                'Specification-Version' : '1',
                'Implementation-Title'  : mod_name,
                'Implementation-Version': project.jar.archiveVersion.get(),
                'Implementation-Vendor' : mod_authors,
                'MixinConfigs'          : 'bsod.mixins.json'
        ])
    }
}